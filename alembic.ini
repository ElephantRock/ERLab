# Alembic configuration for Elephant Rock Research Platform.
# The database URL is read dynamically from backend.config — do NOT set
# sqlalchemy.url here (env.py handles it at runtime).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

# Phase 4 / 4G: prevent alembic's fileConfig() from disabling every pre-existing
# logger in the process. When alembic's command.upgrade/downgrade runs, it calls
# logging.config.fileConfig() with this file; the default
# disable_existing_loggers=True disables any logger created before the call
# (e.g. backend.pipeline.gap_analysis.gap_analyzer), which breaks caplog
# capture in any test that runs after a migration test in the same session.
disable_existing_loggers = False

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
