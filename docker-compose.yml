version: "3.9"

# ── Elephant Rock — One-Command Deployment ──────────────────────
#
# Usage:
#   1. cp .env.docker .env   (edit with your API keys)
#   2. docker compose up --build
#   3. Open http://localhost:3000
#
# Backend API: http://localhost:8000
# Frontend:    http://localhost:3000

services:
  # ── Backend (FastAPI) ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      EROCK_DATABASE_URL: sqlite:///./data/elephant_rock.db
      EROCK_CHROMA_PERSIST_DIR: /app/data/chroma
    env_file:
      - .env
    volumes:
      - erock_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Frontend (React + Nginx) ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  erock_data:
