name: v1.0.1 Live Paper Product E2E PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-paper-product-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/evidence/live-paper
      ERLAB_API_BASE: http://127.0.0.1:8000
      ERLAB_FRONTEND_URL: http://127.0.0.1:5173
      ERLAB_PIPELINE_TIMEOUT_SECONDS: "3600"
      ERLAB_POLL_SECONDS: "10"
      EROCK_DATABASE_URL: sqlite:///${{ github.workspace }}/evidence/live-paper/live-paper.db
      EROCK_ENV: development
      EROCK_AUTH_ENABLED: "false"
      EROCK_API_KEY: ""
      EROCK_RATE_LIMIT_ENABLED: "false"
      EROCK_BUDGET_ENABLED: "true"
      EROCK_BUDGET_MAX_COST_USD: "2.00"
      EROCK_BUDGET_MAX_TOKENS: "120000"
      EROCK_BUDGET_MAX_SECONDS: "3600"
      EROCK_SEARCH_DEPTH: "1"
      EROCK_RETRIEVAL_MODE: substring
      EROCK_RERANKER_ENABLED: "false"
      EROCK_EMBEDDING_FALLBACK_ENABLED: "true"
      EROCK_AUTONOMY_ENABLED: "false"
      EROCK_AUTONOMY_SCHEDULE_ENABLED: "false"
      EROCK_LMSTUDIO_ENABLED: "false"
      OPENAI_PRIMARY: ${{ secrets.EROCK_OPENAI_API_KEY }}
      OPENAI_FALLBACK: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_PRIMARY: ${{ secrets.EROCK_ANTHROPIC_API_KEY }}
      ANTHROPIC_FALLBACK: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_PRIMARY: ${{ secrets.EROCK_GEMINI_API_KEY }}
      GEMINI_FALLBACK: ${{ secrets.GEMINI_API_KEY }}
      S2_PRIMARY: ${{ secrets.EROCK_SEMANTIC_SCHOLAR_API_KEY }}
      S2_FALLBACK: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Select available provider without exposing credentials
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          candidates = [
              ("openai", os.environ.get("OPENAI_PRIMARY") or os.environ.get("OPENAI_FALLBACK"), "EROCK_OPENAI_API_KEY"),
              ("anthropic", os.environ.get("ANTHROPIC_PRIMARY") or os.environ.get("ANTHROPIC_FALLBACK"), "EROCK_ANTHROPIC_API_KEY"),
              ("gemini", os.environ.get("GEMINI_PRIMARY") or os.environ.get("GEMINI_FALLBACK"), "EROCK_GEMINI_API_KEY"),
          ]
          selected = next(((name, key, env_name) for name, key, env_name in candidates if key), None)
          env_file = Path(os.environ["GITHUB_ENV"])
          if selected:
              name, key, env_name = selected
              with env_file.open("a", encoding="utf-8") as handle:
                  handle.write(f"EROCK_DEFAULT_PROVIDER={name}\n")
                  handle.write(f"{env_name}={key}\n")
              status = {"provider": name, "available": True, "credential_recorded": False}
          else:
              status = {"provider": None, "available": False, "credential_recorded": False}
          s2 = os.environ.get("S2_PRIMARY") or os.environ.get("S2_FALLBACK")
          if s2:
              with env_file.open("a", encoding="utf-8") as handle:
                  handle.write(f"EROCK_SEMANTIC_SCHOLAR_API_KEY={s2}\n")
          evidence = Path(os.environ["EVIDENCE_DIR"])
          (evidence / "workflow_provider_availability.json").write_text(json.dumps(status, indent=2))
          PY

      - name: Execute live product E2E
        run: bash audit/run_live_paper_e2e.sh

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erlab-v1.0.1-live-paper-product-e2e-pr
          path: evidence/live-paper/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce recorded verdict
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          path = Path(os.environ["EVIDENCE_DIR"]) / "live_paper_e2e_verdict.json"
          if not path.exists():
              print("No verdict artifact was generated")
              sys.exit(1)
          verdict = json.loads(path.read_text())
          print("Live paper product E2E verdict:", verdict.get("verdict"))
          sys.exit(0 if verdict.get("verdict") == "MET" else 1)
          PY
