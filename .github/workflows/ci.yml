name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize database
        run: python -c "from backend.db.database import init_db; init_db()"

      - name: Run tests
        run: >
          pytest
          -m "not slow and not integration"
          --cov=backend
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # B-CI-02: pin Ruff so the ratchet baseline below is reproducible.
          # The finding count is version-sensitive (4428 on 0.6.9, 4457 on
          # 0.15.16, drifting further on newer releases). Pinning decouples
          # the ratchet from upstream diagnostic changes.
          pip install "ruff==0.15.16"

      - name: Ruff lint regression check
        # Fails only when lint findings INCREASE above the sealed baseline.
        # The baseline is measured against the pinned Ruff version above.
        # B-CI-02: re-sealed from 4439 to 4457 because the prior baseline was
        # set under an unpinned (and now-superseded) Ruff release whose
        # diagnostic set differed. The v1.0.3 branch introduced zero
        # additional findings (4457 == baseline tree). The ratchet remains
        # non-increasing from this newly measured baseline.
        run: |
          ruff check backend/ --output-format=json > /tmp/ruff_current.json 2>&1 || true
          python -c "
          import json, sys
          with open('/tmp/ruff_current.json') as f:
              findings = json.load(f)
          current = len(findings)
          baseline = 4457
          if current > baseline:
              print(f'FAIL: {current} findings > baseline {baseline} (+{current - baseline} new)')
              sys.exit(1)
          else:
              print(f'PASS: {current} findings <= baseline {baseline} ({baseline - current} below)')
          "

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: TypeScript error-budget ratchet (F0.5)
        run: npm run ts:budget

      - name: Build
        run: npm run build

      - name: Upload frontend build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint regression check
        # Fails only when lint errors INCREASE above the frozen baseline.
        # Uses structured JSON output for fail-closed parsing.
        run: |
          npx eslint . --format json --output-file /tmp/eslint_report.json 2>&1 || true
          if [ ! -f /tmp/eslint_report.json ]; then
            echo "FAIL: ESLint did not produce JSON output — possible crash"
            exit 1
          fi
          ERROR_COUNT=$(node -e "
            const r = require('/tmp/eslint_report.json');
            const count = r.reduce((sum, f) => sum + f.errorCount, 0);
            console.log(count);
          " 2>/dev/null || echo "PARSE_ERROR")
          if [ "$ERROR_COUNT" = "PARSE_ERROR" ]; then
            echo "FAIL: Could not parse ESLint JSON output"
            exit 1
          fi
          BASELINE=29
          if [ "$ERROR_COUNT" -gt "$BASELINE" ]; then
            echo "FAIL: $ERROR_COUNT errors > baseline $BASELINE"
            exit 1
          else
            echo "PASS: $ERROR_COUNT errors <= baseline $BASELINE"
          fi
