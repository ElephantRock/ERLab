name: Nightly E2E

on:
  schedule:
    - cron: "0 3 * * *"  # 3 AM UTC daily
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    env:
      EROCK_DEFAULT_PROVIDER: anthropic
      EROCK_ANTHROPIC_API_KEY: ${{ secrets.EROCK_ANTHROPIC_API_KEY }}
      EROCK_ANTHROPIC_MODEL: ${{ secrets.EROCK_ANTHROPIC_MODEL || 'glm-5.1' }}
      EROCK_ANTHROPIC_BASE_URL: ${{ secrets.EROCK_ANTHROPIC_BASE_URL }}
      EROCK_MEMORY_ENABLED: false
      EROCK_SELF_IMPROVE_ENABLED: false
      EROCK_GOVERNANCE_ENABLED: false
      EROCK_BUDGET_ENABLED: false
      EROCK_AUTONOMY_ENABLED: false
      EROCK_SKILLS_ENABLED: false
      EROCK_MULTI_AGENT_ENABLED: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run e2e tests
        run: >
          pytest -p no:asyncio
          -m "slow"
          --cov=backend
          --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-report
          path: htmlcov/
