case_id: paper_extraction-001
stage: paper_extraction
prompt_template: |
  Extract structured information from this paper abstract. Return JSON with keys:
  title, authors (list), year, method, key_findings (list), limitations (list).
  
  Abstract: "Scaling Laws for Neural Language Models (Kaplan et al., 2020).
  We study empirical scaling laws for language model performance on cross-entropy loss.
  We find that loss scales as a power-law with model size, dataset size, and compute.
  Key findings include: (1) Performance depends primarily on scale, not architectural details.
  (2) Larger models are more sample-efficient. Limitations include focus on autoregressive
  transformers only and lack of task-specific evaluation beyond language modeling."
  
  Return valid JSON.
difficulty: medium
requires_grounding: false
output_token_budget: 2048
gold:
  expected_fields:
    title: "Scaling Laws for Neural Language Models"
    year: 2020
    method: "empirical scaling laws"
  expected_keys:
    - title
    - authors
    - year
    - method
    - key_findings
  planted_errors: []
