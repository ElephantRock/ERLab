case_id: paper_synthesis-001
stage: paper_synthesis
requires_grounding: true
difficulty: hard
input_token_budget: 4096
output_token_budget: 4096
input_context:
  corpus:
    - source_id: "S1"
      title: "Attention Is All You Need (Vaswani et al., 2017)"
      abstract: "Proposes Transformer architecture based on self-attention. Achieves 28.4 BLEU on WMT 2014 EN-DE translation. Self-attention allows parallel computation."
      key_claims:
        - "Transformers outperform RNNs and CNNs on translation"
        - "Self-attention has O(1) path length between any two positions"
      limitations:
        - "Memory intensive for long sequences (O(n^2) attention)"
    - source_id: "S2"
      title: "BERT (Devlin et al., 2019)"
      abstract: "Bidirectional pre-training for language understanding. Achieves SOTA on 11 NLP tasks including GLUE, SQuAD v1.1 (93.2 F1), and SQuAD v2.0."
      key_claims:
        - "Bidirectional context improves understanding"
        - "Masked language modeling is effective pre-training objective"
      limitations:
        - "Cannot generate text autoregressively"
    - source_id: "S3"
      title: "GPT-2 (Radford et al., 2019)"
      abstract: "Demonstrates language models can perform downstream tasks without supervision. GPT-2 generates coherent text passages."
      key_claims:
        - "Language models learn downstream tasks without supervision"
        - "Scaling improves zero-shot performance"
      limitations:
        - "May generate biased or factually incorrect text"
  allowed_evidence_ids: ["S1", "S2", "S3"]

prompt_template: |
  Write a brief "Related Work" section (3 paragraphs) for a paper on "Pre-training Methods for NLP".
  Use ONLY these evidence sources: S1 (Vaswani et al.), S2 (Devlin et al.), S3 (Radford et al.).
  Mark each factual claim with [S1], [S2], or [S3]. Do NOT cite any other sources.
  Do NOT fabricate citations. Mark hypotheses as "we hypothesize" or "we propose".

gold:
  corpus_sources:
    - source_id: "S1"
    - source_id: "S2"
    - source_id: "S3"
  claims:
    - claim_id: "expected-1"
      support_label: "supported"
      supporting_sources: ["S1"]
      rationale: "Transformer self-attention from S1 should be discussed."
    - claim_id: "expected-2"
      support_label: "supported"
      supporting_sources: ["S2"]
      rationale: "BERT bidirectional pre-training from S2 should be discussed."
    - claim_id: "expected-3"
      support_label: "supported"
      supporting_sources: ["S3"]
      rationale: "GPT-2 unsupervised learning from S3 should be discussed."
    - claim_id: "forbidden-1"
      support_label: "fabricated_citation"
      cited_sources: ["SX"]
      rationale: "Any citation not in {S1,S2,S3} is fabricated."
  expected_fields:
    topic: "Pre-training Methods for NLP"
  expected_keys:
    - "S1"
    - "S2"
    - "S3"
    - "Vaswani"
    - "Devlin"
    - "Radford"
  notes: "paper_synthesis: 3 corpus sources, expect supported claims from S1/S2/S3, fabricated citations forbidden."
