case_id: adversarial_review-003
stage: adversarial_review
requires_grounding: true
difficulty: hard
input_token_budget: 4096
output_token_budget: 2048
input_context:
  corpus:
    - source_id: "P1"
      title: "Dropout: A Simple Way to Prevent Overfitting"
      abstract: "We introduce dropout which prevents overfitting by randomly dropping units during training. Dropout improves performance on speech recognition, document classification, and benchmarks including MNIST and CIFAR-10."
      key_claims:
        - "Dropout prevents overfitting by random unit deactivation"
        - "Dropout improves results on multiple benchmarks"
      limitations:
        - "Increases training time by factor of 2-3x"
        - "Requires careful tuning of dropout rate"
    - source_id: "P2"
      title: "Batch Normalization: Accelerating Deep Network Training"
      abstract: "We propose batch normalization to address internal covariate shift. BN allows higher learning rates and reduces sensitivity to initialization."
      key_claims:
        - "Batch normalization reduces internal covariate shift"
        - "BN enables higher learning rates"
      limitations:
        - "Performance degrades with small batch sizes"
    - source_id: "P3"
      title: "Layer Normalization"
      abstract: "We propose layer normalization which normalizes across features instead of batch dimension. LN works well with recurrent networks and small batch sizes."
      key_claims:
        - "Layer normalization works with small batch sizes"
        - "LN is effective for recurrent networks"
      limitations:
        - "Less effective than BN for convolutional networks with large batches"

prompt_template: |
  Review the following paragraph and identify problems (overclaims, citation mismatches,
  unsupported assertions, missing controls, missing limitations). List each issue.
  
  Corpus for verification:
    P1: "Dropout" — Prevents overfitting, improves benchmarks, increases training time 2-3x, needs dropout rate tuning.
    P2: "Batch Normalization" — Reduces internal covariate shift, higher learning rates, degrades with small batches.
    P3: "Layer Normalization" — Normalizes across features, works with small batches and RNNs, less effective for CNNs with large batches.
  
  Paragraph:
  "Our regularization method combines dropout (P1) with batch normalization (P2), achieving perfect
  generalization on all datasets we tested. Dropout eliminates the need for any other regularization
  technique, and batch normalization solves the internal covariate shift problem completely. Unlike
  layer normalization (P3), which only works for NLP tasks, our method is universal across all
  domains. We did not compare against data augmentation because it is unnecessary with our approach."

gold:
  corpus_sources:
    - source_id: "P1"
    - source_id: "P2"
    - source_id: "P3"
  claims:
    - claim_id: "A1"
      text: "achieving perfect generalization on all datasets"
      support_label: "unsupported"
      rationale: "Neither P1 nor P2 claims perfect generalization. No evidence for 'all datasets'."
    - claim_id: "A2"
      text: "Dropout eliminates the need for any other regularization technique"
      support_label: "unsupported"
      rationale: "P1 says dropout prevents overfitting, not that it eliminates need for all other regularization."
    - claim_id: "A3"
      text: "batch normalization solves the internal covariate shift problem completely"
      support_label: "unsupported"
      rationale: "P2 says BN reduces (not eliminates) covariate shift. 'Completely' is an overclaim."
    - claim_id: "A4"
      text: "layer normalization only works for NLP tasks"
      support_label: "wrong_citation"
      cited_sources: ["P3"]
      rationale: "P3 says LN works with small batch sizes and RNNs, not 'only NLP'. Mischaracterization."
    - claim_id: "A5"
      text: "our method is universal across all domains"
      support_label: "unsupported"
      rationale: "No evidence for universality across all domains."
    - claim_id: "A6"
      text: "we did not compare against data augmentation"
      support_label: "unsupported"
      rationale: "Missing control: data augmentation is a standard baseline. Exclusion without justification is a weakness."
  planted_errors:
    - type: overclaim
      indicator: "perfect generalization"
    - type: overclaim
      indicator: "eliminates the need for any other"
    - type: overclaim
      indicator: "completely"
    - type: wrong_citation
      indicator: "only works for NLP tasks"
    - type: overclaim
      indicator: "universal across all domains"
    - type: missing_control
      indicator: "did not compare against data augmentation"
  notes: "Planted: overclaim (A1,A2,A3,A5), wrong_citation (A4), missing_control (A6). 6 defects."
