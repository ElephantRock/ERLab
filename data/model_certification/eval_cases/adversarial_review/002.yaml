case_id: adversarial_review-002
stage: adversarial_review
requires_grounding: true
difficulty: hard
input_token_budget: 4096
output_token_budget: 2048
input_context:
  corpus:
    - source_id: "P1"
      title: "Deep Residual Learning for Image Recognition"
      abstract: "We present residual learning framework. 152-layer ResNet wins 1st place on ILSVRC 2015 with 3.57% top-5 error rate."
      key_claims:
        - "ResNets enable training of very deep networks"
        - "ResNet achieves 3.57% top-5 error on ImageNet"
      limitations:
        - "Only evaluated on image classification"
    - source_id: "P2"
      title: "DenseNet: Densely Connected Convolutional Networks"
      abstract: "We propose DenseNet with dense connections between layers. DenseNet achieves state-of-the-art on CIFAR-10, CIFAR-100, and SVHN with fewer parameters."
      key_claims:
        - "Dense connections improve parameter efficiency"
        - "DenseNet achieves SOTA on CIFAR benchmarks"
      limitations:
        - "Higher memory consumption from feature concatenation"

prompt_template: |
  Review the following research paragraph and identify problems (overclaims, citation mismatches,
  unsupported assertions, logical errors, missing limitations). List each issue found.
  
  Corpus for verification:
    P1: "Deep Residual Learning" — ResNet, 152 layers, 3.57% top-5 ImageNet, only evaluated on classification.
    P2: "DenseNet" — Dense connections, SOTA on CIFAR-10/100/SVHN, fewer parameters, higher memory.
  
  Paragraph to review:
  "Our method builds on residual learning (P1) and achieves 99.9% accuracy on ImageNet classification,
  outperforming ResNet by a large margin. Unlike DenseNet (P2), which only works on small datasets,
  our approach generalizes to all vision tasks including object detection, segmentation, and video
  understanding. Our method runs in O(1) time complexity and requires no GPU for inference.
  We evaluated on ImageNet and achieved a top-1 error rate of 0.1%."

gold:
  corpus_sources:
    - source_id: "P1"
    - source_id: "P2"
  claims:
    - claim_id: "A1"
      text: "achieves 99.9% accuracy on ImageNet"
      support_label: "unsupported"
      supporting_sources: []
      rationale: "P1 states ResNet achieves 3.57% top-5 error. 99.9% accuracy claim has no evidence."
    - claim_id: "A2"
      text: "DenseNet only works on small datasets"
      support_label: "wrong_citation"
      cited_sources: ["P2"]
      supporting_sources: []
      rationale: "P2 says DenseNet achieves SOTA on CIFAR, not that it only works on small datasets. Mischaracterization."
    - claim_id: "A3"
      text: "generalizes to all vision tasks including object detection, segmentation, and video understanding"
      support_label: "unsupported"
      supporting_sources: []
      rationale: "P1 limitations state only evaluated on image classification. No evidence for generalization."
    - claim_id: "A4"
      text: "runs in O(1) time complexity"
      support_label: "unsupported"
      supporting_sources: []
      rationale: "No source mentions O(1) complexity. Deep networks have non-trivial complexity."
    - claim_id: "A5"
      text: "requires no GPU for inference"
      support_label: "unsupported"
      supporting_sources: []
      rationale: "No source discusses inference hardware requirements."
    - claim_id: "A6"
      text: "achieved a top-1 error rate of 0.1%"
      support_label: "unsupported"
      supporting_sources: []
      rationale: "P1 reports 3.57% top-5 error for ResNet. 0.1% is not supported by any source."
  planted_errors:
    - type: overclaim
      indicator: "99.9% accuracy"
    - type: wrong_citation
      indicator: "DenseNet only works on small datasets"
    - type: overclaim
      indicator: "generalizes to all vision tasks"
    - type: unsupported
      indicator: "O(1) time complexity"
    - type: unsupported
      indicator: "no GPU for inference"
    - type: overclaim
      indicator: "0.1% top-1 error rate"
  notes: "Planted: overclaim (A1,A3,A6), wrong_citation (A2), unsupported (A4,A5). 6 total defects."
