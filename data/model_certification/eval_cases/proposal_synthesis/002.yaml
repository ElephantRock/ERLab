case_id: proposal_synthesis-002
stage: proposal_synthesis
requires_grounding: true
difficulty: hard
input_token_budget: 4096
output_token_budget: 4096
input_context:
  corpus:
    - source_id: "S1"
      title: "Constitutional AI (Bai et al., 2022)"
      abstract: "We propose Constitutional AI where AI systems are guided by a set of principles. CAI reduces harmful outputs while maintaining helpfulness."
      key_claims:
        - "Principle-guided self-correction reduces harmful outputs"
        - "CAI maintains helpfulness while improving safety"
      limitations:
        - "Principles must be carefully designed"
        - "Evaluation limited to text-based interactions"
    - source_id: "S2"
      title: "RLHF: Training Language Models to Follow Instructions (Ouyang et al., 2022)"
      abstract: "We fine-tune GPT-3 with human feedback. InstructGPT is preferred over GPT-3 on 85% of prompts by human labelers."
      key_claims:
        - "RLHF aligns model behavior with human preferences"
        - "InstructGPT preferred on 85% of prompts"
      limitations:
        - "Human labelers may have biases"
        - "Alignment is to labeler preferences, not universal values"
    - source_id: "S3"
      title: "Red Teaming Language Models (Perez et al., 2022)"
      abstract: "We use language models themselves to generate test cases for red teaming. Discovered many failure modes in dialogue models."
      key_claims:
        - "Automated red teaming discovers harmful outputs"
        - "LM-generated test cases find diverse failure modes"
      limitations:
        - "Red team coverage depends on generator model capability"
  allowed_evidence_ids: ["S1", "S2", "S3"]

prompt_template: |
  Write a brief proposal for "Automated AI Safety via Self-Improving Red Teaming" covering:
  1. Method: combine Constitutional AI with automated red teaming and RLHF
  2. Evaluation: safety benchmarks, human evaluation, comparison with baselines
  
  Use ONLY these evidence sources: S1 (Constitutional AI), S2 (RLHF), S3 (Red Teaming).
  Mark each factual claim with [S1], [S2], or [S3].
  Method proposals that go BEYOND what sources state must be marked as hypotheses.
  Do NOT cite other sources. Do NOT state proposals as established facts.

gold:
  corpus_sources:
    - source_id: "S1"
    - source_id: "S2"
    - source_id: "S3"
  claims:
    - claim_id: "expected-1"
      support_label: "supported"
      supporting_sources: ["S1"]
      rationale: "Constitutional AI self-correction from S1."
    - claim_id: "expected-2"
      support_label: "supported"
      supporting_sources: ["S2"]
      rationale: "RLHF alignment from S2."
    - claim_id: "expected-3"
      support_label: "supported"
      supporting_sources: ["S3"]
      rationale: "Automated red teaming from S3."
    - claim_id: "hypothesis-check"
      support_label: "unsupported"
      rationale: "Claim that combining CAI + red teaming + RLHF is self-improving must be hypothesis, not fact."
    - claim_id: "overclaim-check"
      support_label: "unsupported"
      rationale: "Claiming the method solves AI safety or eliminates all harmful outputs is overclaim."
    - claim_id: "forbidden-1"
      support_label: "fabricated_citation"
      cited_sources: ["SX"]
      rationale: "Any citation not in {S1,S2,S3} is fabricated."
  expected_fields:
    topic: "AI Safety"
  expected_keys:
    - "S1"
    - "S2"
    - "S3"
  notes: "proposal_synthesis: overclaim about solving AI safety should be flagged. Method proposals must be hypotheses."
