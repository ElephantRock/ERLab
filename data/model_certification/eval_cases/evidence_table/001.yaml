case_id: evidence_table-001
stage: evidence_table
prompt_template: |
  Build an evidence table from these claims about "Retrieval-Augmented Generation":
  
  Claim 1: "RAG reduces hallucination by grounding generation in retrieved documents" (Source: Lewis et al., 2020)
  Claim 2: "RAG systems achieve state-of-the-art on open-domain QA benchmarks" (Source: Izacard & Grave, 2021)
  Claim 3: "RAG completely eliminates the need for model training" (Source: Internal reasoning)
  
  Return JSON array of claims, each with: text, source, supported (bool), notes.
  Flag Claim 3 as potentially unsupported.
difficulty: medium
requires_grounding: true
output_token_budget: 2048
gold:
  expected_keys:
    - Lewis et al
    - Izacard
  expected_fields:
    topic: "RAG"
  planted_errors:
    - type: overclaim
      indicator: "completely eliminates"
