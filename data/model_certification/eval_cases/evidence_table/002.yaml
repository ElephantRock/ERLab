case_id: evidence_table-002
stage: evidence_table
requires_grounding: true
difficulty: medium
input_token_budget: 4096
output_token_budget: 2048
input_context:
  corpus:
    - source_id: "P1"
      title: "Attention Is All You Need"
      abstract: "We propose a new simple network architecture, the Transformer, based solely on attention mechanisms. The model achieves 28.4 BLEU on WMT 2014 English-to-German translation."
      key_claims:
        - "Transformers outperform recurrent and convolutional models on translation tasks"
        - "Self-attention allows modeling dependencies without regard to distance"
      limitations:
        - "Only tested on translation tasks, not generation"
    - source_id: "P2"
      title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
      abstract: "We introduce RAG which combines pre-trained parametric memory with non-parametric memory for generation. RAG models produce state-of-the-art results on Natural Questions, WebQuestions, and CuratedTrec."
      key_claims:
        - "RAG combines parametric and non-parametric memory"
        - "RAG achieves state-of-the-art on open-domain QA benchmarks"
      limitations:
        - "Retrieval quality limits generation quality"
    - source_id: "P3"
      title: "Scaling Laws for Neural Language Models"
      abstract: "We study empirical scaling laws for language model performance on cross-entropy loss. Performance depends on model size, dataset size, and compute budget."
      key_claims:
        - "Loss scales as power law with model size"
        - "Larger models are more sample-efficient"
      limitations:
        - "Scaling laws are empirical, not theoretically derived"
  candidate_claims:
    - claim_id: "C1"
      text: "Transformer models outperform recurrent architectures on machine translation benchmarks"
      cited_sources: ["P1"]
    - claim_id: "C2"
      text: "RAG achieves state-of-the-art results on open-domain QA benchmarks"
      cited_sources: ["P2"]
    - claim_id: "C3"
      text: "Language model loss scales as power law with dataset size"
      cited_sources: ["P1"]
    - claim_id: "C4"
      text: "RAG completely eliminates the need for model training"
      cited_sources: ["P2"]
    - claim_id: "C5"
      text: "Pre-trained language models can reason about visual content"
      cited_sources: ["PX"]

prompt_template: |
  Evaluate these candidate claims against the provided corpus. For each claim,
  determine if it is supported, unsupported, uses the wrong citation, or cites a fabricated source.
  
  Corpus sources:
    P1: "Attention Is All You Need" — Transformer architecture, 28.4 BLEU, self-attention mechanisms.
    P2: "Retrieval-Augmented Generation" — RAG combines parametric and non-parametric memory, state-of-the-art on QA benchmarks.
    P3: "Scaling Laws for Neural Language Models" — Loss scales as power law with model size, larger models more sample-efficient.
  
  Candidate claims:
    C1: "Transformer models outperform recurrent architectures on machine translation benchmarks" (cited: P1)
    C2: "RAG achieves state-of-the-art results on open-domain QA benchmarks" (cited: P2)
    C3: "Language model loss scales as power law with dataset size" (cited: P1)
    C4: "RAG completely eliminates the need for model training" (cited: P2)
    C5: "Pre-trained language models can reason about visual content" (cited: PX)
  
  Return JSON array with: claim_id, support_label (supported|unsupported|wrong_citation|fabricated_citation), correct_source, notes.

gold:
  corpus_sources:
    - source_id: "P1"
    - source_id: "P2"
    - source_id: "P3"
  claims:
    - claim_id: "C1"
      support_label: "supported"
      supporting_sources: ["P1"]
      rationale: "P1 directly states Transformers outperform recurrent models on translation."
    - claim_id: "C2"
      support_label: "supported"
      supporting_sources: ["P2"]
      rationale: "P2 directly states RAG achieves state-of-the-art on QA benchmarks."
    - claim_id: "C3"
      support_label: "wrong_citation"
      cited_sources: ["P1"]
      supporting_sources: ["P3"]
      rationale: "P1 is about Transformers, not scaling laws. P3 covers scaling laws with dataset size."
    - claim_id: "C4"
      support_label: "unsupported"
      supporting_sources: []
      rationale: "P2 does not state RAG eliminates training. This is an overclaim."
    - claim_id: "C5"
      support_label: "fabricated_citation"
      cited_sources: ["PX"]
      supporting_sources: []
      rationale: "PX is not in the corpus. No source discusses visual reasoning."
  expected_fields:
    topic: "evidence evaluation"
  notes: "Tests: supported (C1,C2), wrong_citation (C3), unsupported (C4), fabricated (C5)"
