case_id: evidence_table-004
stage: evidence_table
requires_grounding: true
difficulty: hard
input_token_budget: 4096
output_token_budget: 2048
input_context:
  corpus:
    - source_id: "P1"
      title: "Chain-of-Thought Prompting Elicits Reasoning"
      abstract: "We show that chain-of-thought prompting improves reasoning in large language models. On GSM8K, PaLM 540B achieves 56.9% with CoT vs 17.1% without."
      key_claims:
        - "CoT prompting dramatically improves mathematical reasoning"
        - "Effectiveness scales with model size"
      limitations:
        - "Only tested on specific benchmarks"
        - "Small models (<10B) do not benefit from CoT"
    - source_id: "P2"
      title: "ReAct: Synergizing Reasoning and Acting"
      abstract: "We propose ReAct which combines reasoning and acting in language models. ReAct outperforms reasoning-only and acting-only approaches on HotpotQA and ALFWorld."
      key_claims:
        - "Combining reasoning with action improves task performance"
        - "ReAct is more interpretable than reasoning-only methods"
      limitations:
        - "Additional computational cost from action generation"
    - source_id: "P3"
      title: "Self-Consistency Improves Chain-of-Thought Reasoning"
      abstract: "We show that sampling multiple reasoning paths and selecting the most consistent answer improves CoT. Self-consistency achieves 74.2% on GSM8K."
      key_claims:
        - "Majority voting over reasoning paths improves accuracy"
        - "Self-consistency outperforms single-path CoT"
      limitations:
        - "Requires multiple inference passes"

prompt_template: |
  Evaluate these candidate claims against the provided corpus.
  
  Corpus:
    P1: "Chain-of-Thought" — CoT improves reasoning, 56.9% on GSM8K with CoT, scales with model size, small models don't benefit.
    P2: "ReAct" — Combines reasoning+acting, better than reasoning-only, more interpretable, higher compute cost.
    P3: "Self-Consistency" — Multiple reasoning paths + majority vote, 74.2% on GSM8K, requires multiple passes.
  
  Claims:
    C1: "CoT prompting achieves 56.9% on GSM8K with PaLM 540B" (cited: P1)
    C2: "Self-consistency achieves 74.2% accuracy on GSM8K" (cited: P3)
    C3: "Chain-of-thought is equally effective for all model sizes" (cited: P1)
    C4: "ReAct achieves state-of-the-art on all NLP benchmarks" (cited: P2)
    C5: "Self-consistency requires only a single inference pass" (cited: P3)
    C6: "Emergent abilities appear only in models exceeding 100B parameters" (cited: P1)
  
  Return JSON array with: claim_id, support_label, correct_source, notes.

gold:
  corpus_sources:
    - source_id: "P1"
    - source_id: "P2"
    - source_id: "P3"
  claims:
    - claim_id: "C1"
      support_label: "supported"
      supporting_sources: ["P1"]
      rationale: "P1 explicitly states 56.9% on GSM8K with PaLM 540B and CoT."
    - claim_id: "C2"
      support_label: "supported"
      supporting_sources: ["P3"]
      rationale: "P3 explicitly states 74.2% on GSM8K with self-consistency."
    - claim_id: "C3"
      support_label: "contradicted"
      cited_sources: ["P1"]
      contradicting_sources: ["P1"]
      rationale: "P1 states small models (<10B) do NOT benefit from CoT, contradicting 'equally effective for all sizes'."
    - claim_id: "C4"
      support_label: "unsupported"
      supporting_sources: []
      rationale: "P2 only claims improvement on HotpotQA and ALFWorld, not 'all NLP benchmarks'."
    - claim_id: "C5"
      support_label: "contradicted"
      cited_sources: ["P3"]
      contradicting_sources: ["P3"]
      rationale: "P3 explicitly says self-consistency requires multiple inference passes."
    - claim_id: "C6"
      support_label: "unsupported"
      cited_sources: ["P1"]
      supporting_sources: []
      rationale: "P1 discusses CoT and model size but does not mention emergent abilities or 100B threshold."
  expected_fields:
    topic: "reasoning methods"
  notes: "Tests: supported (C1,C2), contradicted (C3,C5), unsupported (C4,C6). Real citations used correctly and incorrectly."
