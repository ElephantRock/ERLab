case_id: evidence_table-003
stage: evidence_table
requires_grounding: true
difficulty: medium
input_token_budget: 4096
output_token_budget: 2048
input_context:
  corpus:
    - source_id: "P1"
      title: "BERT: Pre-training of Deep Bidirectional Transformers"
      abstract: "We introduce BERT which pre-trains deep bidirectional representations. BERT achieves state-of-the-art on 11 NLP tasks."
      key_claims:
        - "Bidirectional pre-training improves language understanding"
        - "BERT achieves SOTA on GLUE, SQuAD, and SWAG"
      limitations:
        - "BERT is autoregressive and cannot generate text"
    - source_id: "P2"
      title: "GPT-3: Language Models are Few-Shot Learners"
      abstract: "We demonstrate that scaling up language models improves task-agnostic performance. GPT-3 achieves strong results on many NLP tasks with just few-shot examples."
      key_claims:
        - "Scaling improves in-context learning"
        - "GPT-3 performs well on translation, QA, and reasoning without fine-tuning"
      limitations:
        - "Generates plausible but factually incorrect text"
    - source_id: "P3"
      title: "T5: Exploring the Limits of Transfer Learning"
      abstract: "We unify all NLP tasks into a text-to-text format. T5 achieves state-of-the-art on GLUE and SuperGLUE benchmarks."
      key_claims:
        - "Text-to-text format is a unified approach for NLP"
        - "T5 achieves SOTA on GLUE and SuperGLUE"
      limitations:
        - "Requires massive pre-training data"

prompt_template: |
  Evaluate these candidate claims against the provided corpus.
  
  Corpus sources:
    P1: "BERT" — Bidirectional pre-training, SOTA on 11 NLP tasks, cannot generate text.
    P2: "GPT-3" — Few-shot learning via scaling, good at translation/QA/reasoning, can generate incorrect text.
    P3: "T5" — Text-to-text format, SOTA on GLUE/SuperGLUE, needs massive pre-training data.
  
  Candidate claims:
    C1: "BERT achieves state-of-the-art results on GLUE and SQuAD" (cited: P1)
    C2: "GPT-3 can perform NLP tasks without any fine-tuning" (cited: P2)
    C3: "BERT is the best model for text generation tasks" (cited: P1)
    C4: "T5 achieves state-of-the-art on GLUE and SuperGLUE" (cited: P2)
    C5: "XLNet outperforms all auto-regressive models on long-document summarization" (cited: P99)
    C6: "GPT-3's in-context learning improves with model scale" (cited: P2)
  
  Return JSON array with: claim_id, support_label (supported|unsupported|wrong_citation|fabricated_citation|contradicted), correct_source, notes.

gold:
  corpus_sources:
    - source_id: "P1"
    - source_id: "P2"
    - source_id: "P3"
  claims:
    - claim_id: "C1"
      support_label: "supported"
      supporting_sources: ["P1"]
      rationale: "P1 states BERT achieves SOTA on 11 NLP tasks including GLUE and SQuAD."
    - claim_id: "C2"
      support_label: "supported"
      supporting_sources: ["P2"]
      rationale: "P2 states GPT-3 performs well on tasks without fine-tuning via few-shot."
    - claim_id: "C3"
      support_label: "contradicted"
      cited_sources: ["P1"]
      contradicting_sources: ["P1"]
      rationale: "P1 limitations state BERT cannot generate text. Best for generation contradicts the source."
    - claim_id: "C4"
      support_label: "wrong_citation"
      cited_sources: ["P2"]
      supporting_sources: ["P3"]
      rationale: "T5 achieves SOTA on GLUE/SuperGLUE (P3), not GPT-3 (P2). Real citation but wrong source."
    - claim_id: "C5"
      support_label: "fabricated_citation"
      cited_sources: ["P99"]
      supporting_sources: []
      rationale: "P99 is not in the corpus. XLNet not discussed."
    - claim_id: "C6"
      support_label: "supported"
      supporting_sources: ["P2"]
      rationale: "P2 states scaling improves in-context learning."
  expected_fields:
    topic: "model comparison"
  notes: "Tests: supported (C1,C2,C6), contradicted (C3), wrong_citation (C4), fabricated (C5)"
