case_id: literature_filtering-001
stage: literature_filtering
prompt_template: |
  Given a research topic "efficient inference for large language models",
  determine which of these papers are relevant (RELEVANT) or not relevant (NOT_RELEVANT).
  Return JSON with paper IDs mapped to relevance decisions.
  
  Papers:
  P1: "FlashAttention: Fast and Memory-Efficient Exact Attention" (2022)
  P2: "A Survey of Quantum Computing Algorithms" (2021)
  P3: "KV-Cache Compression for Transformer Inference" (2024)
  P4: "Deep Learning for Weather Prediction" (2023)
  P5: "Speculative Decoding for Fast LLM Inference" (2023)
  
  Return JSON: {"P1": "RELEVANT", "P2": "...", ...}
difficulty: easy
requires_grounding: false
output_token_budget: 1024
gold:
  inclusion_set:
    - P1
    - P3
    - P5
  planted_errors: []
