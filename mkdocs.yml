site_name: Elephant Rock Research
site_description: AI-powered research idea generation platform — documentation & API reference
site_author: Elephant Rock Team
site_url: https://elephant-rock-platform.github.io/

repo_name: elephant-rock-platform
repo_url: https://github.com/elephant-rock-platform/elephant-rock-platform

docs_dir: docs
exclude_docs: |
  aiv/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - API Reference: api-reference.md
  - Endpoints:
      - Ideas: endpoints/ideas.md
      - Gaps: endpoints/gaps.md
      - Pipeline: endpoints/pipeline.md
      - Costs: endpoints/costs.md
      - Memory: endpoints/memory.md
      - Governance: endpoints/governance.md
      - Traces: endpoints/traces.md
      - Sessions: endpoints/sessions.md
      - Literature: endpoints/literature.md
      - Knowledge: endpoints/knowledge.md
      - Auth: endpoints/auth.md
      - Collaboration: endpoints/collaboration.md
      - Exports: endpoints/exports.md
      - Plugins: endpoints/plugins.md
      - Knowledge Graph: endpoints/knowledge-graph.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
