# Production overrides — use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
version: "3.9"

services:
  app:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 512M
          cpus: "0.5"
    environment:
      EROCK_DEBUG: "false"
      EROCK_AUTH_ENABLED: "true"

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    restart: always
    volumes:
      - frontend_dist:/output

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  frontend_dist:
