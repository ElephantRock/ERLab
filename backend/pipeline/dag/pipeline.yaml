# ═══════════════════════════════════════════════════════════════
# CogniGen Pipeline Configuration — Single Source of Truth
# BATCH-180 / FIX-01: YAML reflects real production model routing.
#
# Model routing architecture (z.ai cloud — LM Studio offline):
#   thinking   → glm-4.6 via z.ai (cloud)
#                Used for: classification, extraction, ranking, scoring
#   generation → glm-4.6 via z.ai (cloud)
#                Used for: synthesis, writing, ideation, deepening
#   embedding  → bge-m3 via LM Studio GPU (local, 1024d) [offline — will fail soft]
#   reranker   → disabled (LM Studio offline)
# ═══════════════════════════════════════════════════════════════

models:
  thinking:
    provider: openai
    model: glm-4.6
    base_url: https://api.z.ai/api/coding/paas/v4
    max_tokens: 2048
    temperature: 0.1
    description: >
      Cloud LLM for reasoning tasks: classification, extraction,
      ranking, scoring, gap analysis.

  generation:
    provider: openai
    model: glm-4.6
    base_url: https://api.z.ai/api/coding/paas/v4
    max_tokens: 4096
    temperature: 0.7
    description: >
      Cloud LLM for generation tasks: proposal synthesis, paper writing,
      idea generation, proposal deepening.

  embedding:
    provider: lmstudio
    model: text-embedding-bge-m3-embeddings
    base_url: http://100.64.0.2:1234/v1
    dimension: 1024
    description: >
      Local GPU embedding model via LM Studio. 8192-dimensional, multilingual.

  reranker:
    provider: lmstudio
    model: qwen/qwen3-4b-2507
    base_url: http://100.64.0.2:1234/v1
    strategy: llm_chat
    top_k: 20
    description: >
      Chat-based reranking via LM Studio. [OFFLINE — falls back to keyword heuristic]

infrastructure:
  chroma_dir: data/chroma
  bm25_dir: data/bm25
  database: data/research.db
  server:
    host: 0.0.0.0
    port: 8000

budgets:
  max_papers: 50
  max_gaps: 30
  max_ideas: 20
  max_abstract_chars: 800
  trim_top_k: 20
  stage_timeout: 1800
  total_timeout: 7200

search:
  sources:
    - crossref
    - openalex
    - semantic_scholar
  queries_per_source: 5
  citation_explore: true
  cooldown_seconds: 2

strategies:
  deep_research:
    stages:
      - literature_search
      - ingestion
      - gap_analysis
      - gap_reflection
      - idea_generation
      - idea_reflection
      - novelty_checking
      - feasibility_scoring
      - mechanical_metrics
      - proposal_synthesis
      - adversarial_review
      - evaluation
      - paper_synthesis
      - citation_audit
      - proposal_deepening
      - export
    description: >
      Full pipeline: 16 stages, ~25 minutes. Literature search with
      reranking, gap analysis via local LLM, tree search idea generation,
      novelty checking with embeddings, full proposal synthesis via cloud,
      adversarial review, paper synthesis, citation audit, deepening.

  fast_scan:
    stages:
      - literature_search
      - ingestion
      - gap_analysis
      - feasibility_scoring
      - proposal_synthesis
      - export
    description: >
      Quick scan: 6 stages, ~5 minutes. Literature search, gap analysis,
      feasibility scoring, light synthesis, export. Skips tree search,
      novelty, metrics, adversarial, paper synthesis, citation audit.

  academic_proposal:
    stages:
      - literature_search
      - ingestion
      - gap_analysis
      - gap_reflection
      - idea_generation
      - idea_reflection
      - novelty_checking
      - feasibility_scoring
      - mechanical_metrics
      - proposal_synthesis
      - adversarial_review
      - evaluation
      - paper_synthesis
      - citation_audit
      - proposal_deepening
      - export
    description: >
      Academic-grade proposal: full 16-stage pipeline with stricter
      thresholds, paper synthesis and citation audit for publication-ready
      output. ~45 minutes. Same stages as deep_research but with higher
      budgets and longer timeouts.

  literature_review:
    stages:
      - literature_search
      - ingestion
      - gap_analysis
      - export
    description: >
      Literature review only: search, ingest, analyze gaps, export.
      No idea generation, proposals, or citation audit. ~10 minutes.

# ─────────────────────────────────────────────────────────────
# Stage-to-model mapping (verified against orchestrator stage order)
# ─────────────────────────────────────────────────────────────
#
# Stage                → Category    → Model
# ──────────────────────────────────────────────
# literature_search    → thinking    → qwen3-4b  (rerank scoring)
# ingestion            → embedding   → bge-m3    (vector indexing)
# gap_analysis         → thinking    → qwen3-4b  (gap identification)
# gap_reflection       → thinking    → qwen3-4b  (gap refinement)
# idea_generation      → thinking    → qwen3-4b  (tree search)
# idea_reflection      → thinking    → qwen3-4b  (idea refinement)
# novelty_checking     → embedding   → bge-m3    (similarity scoring)
# feasibility_scoring  → thinking    → qwen3-4b  (feasibility assessment)
# mechanical_metrics   → system      → none       (formula-based)
# proposal_synthesis   → generation  → glm-5.1   (full proposals)
# adversarial_review   → thinking    → qwen3-4b  (critique)
# evaluation           → thinking    → qwen3-4b  (7-dim scoring)
# paper_synthesis      → generation  → glm-5.1   (paper writing)
# citation_audit       → thinking    → qwen3-4b  (citation verification)
# proposal_deepening   → generation  → glm-5.1   (proposal enrichment)
# export               → system      → none       (file generation)
