[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elephant-rock"
version = "0.1.0"
description = "AI/NLP Research Idea Generation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "chromadb>=0.5.0",
    "litellm>=1.40",
    "anthropic>=0.30",
    "openai>=1.30",
    "google-generativeai>=0.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "weasyprint>=62",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "python-slugify>=8.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
erock = "backend.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-p no:asyncio"
