[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elephant-rock"
version = "0.1.0"
description = "AI/NLP Research Idea Generation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "chromadb>=0.5.0",
    "litellm>=1.40",
    "anthropic>=0.30",
    "openai>=1.30",
    "google-generativeai>=0.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "weasyprint>=62",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "python-slugify>=8.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "rank-bm25>=0.2",
    "slowapi>=0.1.9",
    "cryptography>=43.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
sandbox = [
    "wasmtime>=20.0",
]
observability = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.scripts]
erock = "backend.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/pipeline/feasibility/*.py" = ["E501"]
"backend/pipeline/gap_analysis/*.py" = ["E501"]
"backend/pipeline/generation/ideator_agent.py" = ["E501"]
"backend/pipeline/governance/validator.py" = ["E501"]
"backend/pipeline/knowledge/retriever.py" = ["E501"]
"backend/pipeline/memory/extraction.py" = ["E501"]
"backend/pipeline/metacognition/monitor.py" = ["E501"]
"backend/pipeline/novelty/novelty_checker.py" = ["E501"]
"backend/pipeline/self_improve/lessons.py" = ["E501"]
"backend/pipeline/skills/proposer_generator.py" = ["E501"]
"backend/api/routes/gaps.py" = ["E501"]
"backend/cli/main.py" = ["E501", "N806"]
"backend/tests/**" = ["E501", "E402", "N806", "B011"]
"backend/providers/provider_factory.py" = ["N806"]
"backend/pipeline/literature/arxiv_source.py" = ["N817"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = ""
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')", "integration: marks tests requiring external APIs", "live: marks tests requiring live LM Studio", "requires_lmstudio: marks tests requiring LM Studio at runtime", "flaky: marks tests that are known to be flaky due to timing or race conditions"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/cli/*"]

[tool.coverage.report]
fail_under = 72
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[dependency-groups]
dev = [
    "pytest-rerunfailures>=16.3",
]
